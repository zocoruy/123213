name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Use HTTPS for public Git dependencies
        shell: pwsh
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - name: Install, test, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload installer and portable application
        uses: actions/upload-artifact@v4
        with:
          name: SprintSelect-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-downloads:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SprintSelect-Windows-x64
          path: release
      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt \
            --verify-tag --prerelease \
            --title "SprintSelect $RELEASE_TAG · Windows" \
            --notes-file docs/RELEASE.md
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
